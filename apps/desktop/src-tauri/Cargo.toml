[package]
name = "agenttrace-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Rayfts/AgentTrace"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
agenttrace-adapter-api = { path = "../../../crates/agenttrace-adapter-api" }
agenttrace-protocol = { path = "../../../crates/agenttrace-protocol" }
agenttrace-redaction = { path = "../../../crates/agenttrace-redaction" }
agenttrace-registry = { path = "../../../crates/agenttrace-registry" }
agenttrace-storage = { path = "../../../crates/agenttrace-storage" }
serde_json = "1"
tauri = "2"
uuid = { version = "1", features = ["serde"] }

# Keep the desktop runtime independent from the core workspace MSRV.
[workspace]
